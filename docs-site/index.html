<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NIS Portal API · student project documentation</title>
  <meta name="description" content="API documentation for NIS Portal API, an open-source student project by Arnur. Read-only reference, no sign-in, no downloads. Not an official Nazarbayev Intellectual Schools website." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    :root { --bg: #1d1d1d; --surface: #252525; --line: #333; --text: #f2f2f0; --muted: #9a9a96; --accent: #a8d8c8; --accent-ink: #12201b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Montserrat", system-ui, sans-serif; }
    body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
      background-image: repeating-linear-gradient(to right, transparent 0 calc(20% - 1px), rgba(255,255,255,.035) calc(20% - 1px) 20%); }
    a { color: inherit; }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

    nav { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 28px 0; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .mono { font-weight: 800; font-size: 22px; letter-spacing: -.04em; }
    .brand small { font-size: 11px; line-height: 1.2; color: var(--muted); }
    .links { display: flex; gap: 32px; font-size: 13px; }
    .links a { text-decoration: none; opacity: .85; }
    .links a:hover { opacity: 1; }
    .right { display: flex; align-items: center; gap: 22px; font-size: 13px; }
    .right a { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(255,255,255,.4); }
    .switch { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
    .switch button { border: 0; background: none; font: 600 11px "Montserrat", sans-serif; color: var(--muted); padding: 5px 11px; border-radius: 999px; cursor: pointer; }
    .switch button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

    .hero { min-height: calc(100vh - 100px); display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 48px; position: relative; padding-bottom: 60px; }
    .eyebrow { font-size: 13px; color: var(--muted); margin: 0 0 22px; }
    h1 { font-weight: 300; font-size: clamp(40px, 5.6vw, 62px); line-height: 1.08; letter-spacing: -.02em; margin: 0; }
    h1 b { font-weight: 700; }
    .lead { font-size: 15px; line-height: 1.6; color: #c4c4be; max-width: 420px; margin: 26px 0 0; }
    .actions { display: flex; align-items: center; gap: 26px; margin-top: 36px; flex-wrap: wrap; }
    .cta { display: inline-block; padding: 18px 36px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); text-decoration: none;
      font: 700 12px/1 "Montserrat", sans-serif; letter-spacing: .1em; text-transform: uppercase; box-shadow: 0 10px 30px -10px rgba(168,216,200,.55); }
    .note { font-size: 12px; color: var(--muted); max-width: 360px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; transform: rotate(1.2deg);
      box-shadow: 0 40px 80px -30px rgba(0,0,0,.8); font-family: "JetBrains Mono", monospace; font-size: 13px; }
    .row { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .m { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; min-width: 52px; text-align: center; }
    .get { background: rgba(97,175,254,.15); color: #8cc4ff; } .post { background: rgba(73,204,144,.15); color: #7fdcae; } .patch { background: rgba(80,227,194,.12); color: #7ce8d0; }
    .row span:last-child { color: var(--muted); font-family: "Montserrat", sans-serif; font-size: 12px; margin-left: auto; }
    .scroll { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); text-decoration: none; }
    .mouse { width: 14px; height: 22px; border: 1.5px solid currentColor; border-radius: 8px; position: relative; }
    .mouse::after { content: ""; position: absolute; left: 50%; top: 4px; width: 2px; height: 5px; margin-left: -1px; border-radius: 2px; background: currentColor; }

    #reference { scroll-margin-top: 24px; }
    #swagger { background: #fff; color: #1d1d1d; border-radius: 18px; margin: 0 auto 60px; max-width: 1160px; overflow: hidden; }
    .swagger-ui .topbar, .swagger-ui .info { display: none; }
    .swagger-ui, .swagger-ui .opblock-tag, .swagger-ui .opblock .opblock-summary-description { font-family: "Montserrat", system-ui, sans-serif; }
    .swagger-ui .opblock-tag { font-size: 18px; font-weight: 600; }
    .swagger-ui .scheme-container { box-shadow: none; }

    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; min-height: auto; padding: 30px 0 90px; }
      .panel { transform: none; }
      .links { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="brand" href="#"><span class="mono">NP</span><small>NIS Portal<br />API</small></a>
      <div class="links">
        <a href="#reference" data-en="Endpoints" data-ru="Эндпоинты"></a>
        <a href="https://github.com/arna0/nis-portal-api#run-it" data-en="Run locally" data-ru="Запуск"></a>
        <a href="https://github.com/arna0/nis-portal-api" data-en="Source" data-ru="Код"></a>
      </div>
      <div class="right">
        <div class="switch" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="ru">RU</button></div>
        <a href="https://github.com/arna0" data-en="Made by Arnur" data-ru="Автор: Арнур"></a>
      </div>
    </nav>

    <section class="hero">
      <div>
        <p class="eyebrow" data-en="Student project · not an official NIS website" data-ru="Студенческий проект · не официальный сайт НИШ"></p>
        <h1><span data-en="The backend for a" data-ru="Бэкенд для"></span><br /><b data-en="school portal" data-ru="школьного портала"></b><br /><span data-en="built around NIS" data-ru="по правилам НИШ"></span></h1>
        <p class="lead" data-en="Classes, students and teachers, the timetable, criteria-based assessment (FO, SOR, SOCh) with report cards, and announcements. FastAPI, async SQLAlchemy, PostgreSQL."
           data-ru="Классы, ученики и учителя, расписание, критериальное оценивание (ФО, СОР, СОЧ) с табелем и объявления. FastAPI, async SQLAlchemy, PostgreSQL."></p>
        <div class="actions">
          <a class="cta" href="#reference" data-en="Browse endpoints" data-ru="Смотреть эндпоинты"></a>
          <span class="note" data-en="Read-only: no sign-in, no forms, nothing to download. To send requests, run docker compose up."
                data-ru="Только документация: без входа, форм и загрузок. Чтобы отправлять запросы, запустите docker compose up."></span>
        </div>
      </div>
      <div class="panel" aria-hidden="true">
        <div class="row"><span class="m get">GET</span>/api/v1/students/<span data-en="List students" data-ru="Список учащихся"></span></div>
        <div class="row"><span class="m post">POST</span>/api/v1/assessments/grades<span data-en="Grade a student" data-ru="Выставить балл"></span></div>
        <div class="row"><span class="m get">GET</span>/assessments/report-card/{id}<span data-en="Report card" data-ru="Табель"></span></div>
        <div class="row"><span class="m patch">PATCH</span>/api/v1/schedule/items/{id}<span data-en="Move a lesson" data-ru="Перенести урок"></span></div>
        <div class="row"><span class="m post">POST</span>/api/v1/announcements/<span data-en="Post news" data-ru="Объявление"></span></div>
      </div>
      <a class="scroll" href="#reference"><span class="mouse"></span><span data-en="Scroll down" data-ru="Листайте вниз"></span></a>
    </section>
  </div>

  <div id="reference" class="wrap"><div id="swagger"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    const KEY = 'nis_docs_lang';
    function render(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-en]').forEach(el => { el.textContent = el.dataset[lang]; });
      document.querySelectorAll('.switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
      try { localStorage.setItem(KEY, lang); } catch (e) {}
      SwaggerUIBundle({
        url: lang === 'en' ? 'openapi.en.json' : 'openapi.json',
        dom_id: '#swagger',
        deepLinking: true,
        docExpansion: 'list',
        supportedSubmitMethods: [],
        defaultModelsExpandDepth: 0,
      });
    }
    document.querySelectorAll('.switch button').forEach(b => b.addEventListener('click', () => render(b.dataset.lang)));
    let saved = new URLSearchParams(location.search).get('lang');
    if (!saved) { try { saved = localStorage.getItem(KEY); } catch (e) {} }
    render(saved === 'ru' ? 'ru' : 'en');
  </script>
</body>
</html>
